<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Babycam</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="stylesheet" href="static/styles.css" />
</head>

<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <audio id="audio" autoplay></audio>

    <div id="label">Babycam</div>

    <div id="battery" class="pill top-right">
      🔋 <span id="batPct">--%</span>
    </div>

    <div id="hud">
      <div class="pill">
        <span class="dot" id="motionDot"></span>
        <span id="motionText">No motion</span>
      </div>

      <div class="pill">
        <span aria-hidden="true">🔊</span>
        <div class="meter"><div class="bar" id="soundBar"></div></div>
      </div>
    </div>

    <button id="tapToUnmute" class="tap hidden">Tap to enable audio</button>
  </div>

  <script defer src="static/app.js"></script>
</body>
</html>
